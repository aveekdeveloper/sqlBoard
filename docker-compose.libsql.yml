# Multi-service compose with libSQL server for production/persistence-at-scale.
# Usage: docker compose -f docker-compose.libsql.yml up -d
services:
  sqld:
    image: ghcr.io/tursodatabase/libsql-server:latest
    container_name: sqlboard-sqld
    environment:
      - SQLD_NODE=primary
      - SQLD_HTTP_LISTEN_ADDR=0.0.0.0:8080
    volumes:
      - sqld-data:/data
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3

  sqlboard:
    build: .
    image: sqlboard:latest
    container_name: sqlboard
    ports:
      - "3001:3001"
    environment:
      - DATA_DIR=/data
      - DATABASE_URL=libsql://sqld:8080
      - LIBSQL_AUTH_TOKEN=${LIBSQL_AUTH_TOKEN:-}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - CACHE_TTL_MINUTES=${CACHE_TTL_MINUTES:-5}
      - MAX_CACHE_ROWS=${MAX_CACHE_ROWS:-10000}
      - QUERY_TIMEOUT_MS=${QUERY_TIMEOUT_MS:-30000}
      - HOST=0.0.0.0
      - PORT=3001
      - CORS_ORIGIN=${CORS_ORIGIN:-}
    volumes:
      - sqlboard-data:/data
    depends_on:
      sqld:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  sqld-data:
    driver: local
  sqlboard-data:
    driver: local
