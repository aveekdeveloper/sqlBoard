# Multi-tenant compose with libSQL + Garage S3 for local testing.
# Usage: docker compose -f docker-compose.multitenant.yml up -d
services:
  sqld:
    image: ghcr.io/tursodatabase/libsql-server:latest
    container_name: sqlboard-sqld
    environment:
      - SQLD_NODE=primary
      - SQLD_HTTP_LISTEN_ADDR=0.0.0.0:8080
    volumes:
      - sqld-data:/data
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5

  garage:
    image: dxflrs/garage:v1.0.0
    container_name: sqlboard-garage
    volumes:
      - garage-data:/data
      - garage-meta:/meta
      - ./garage.toml:/etc/garage.toml:ro
    ports:
      - "3900:3900"   # S3 API
      - "3901:3901"   # RPC
      - "3902:3902"   # Web UI
      - "3903:3903"   # Admin API
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3903/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  garage-init:
    image: dxflrs/garage:v1.0.0
    container_name: sqlboard-garage-init
    depends_on:
      garage:
        condition: service_healthy
    volumes:
      - garage-data:/data
      - garage-meta:/meta
      - ./garage.toml:/etc/garage.toml:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "=== Creating Garage bucket and API key ==="
        garage -c /etc/garage.toml bucket create sqlboard 2>/dev/null || echo "Bucket may already exist"
        garage -c /etc/garage.toml key create sqlboard-key 2>/dev/null || echo "Key may already exist"
        garage -c /etc/garage.toml bucket allow sqlboard --read --write --key sqlboard-key 2>/dev/null || true
        echo "=== Garage init complete ==="
        echo "Run 'garage -c /etc/garage.toml key info sqlboard-key' to get the S3 credentials"
    restart: "no"

  sqlboard:
    build: .
    image: sqlboard:latest
    container_name: sqlboard
    ports:
      - "3001:3001"
    environment:
      - DATA_DIR=/data
      - DATABASE_URL=libsql://sqld:8080
      - LIBSQL_AUTH_TOKEN=
      - SECRET_KEY=dev-secret-change-me
      - TENANCY_ENABLED=true
      - BASE_DOMAIN=localhost
      - S3_ENDPOINT=http://garage:3900
      - S3_ACCESS_KEY=  # set after garage-init runs
      - S3_SECRET_KEY=
      - S3_BUCKET=sqlboard
      - S3_REGION=garage
      - S3_FORCE_PATH_STYLE=true
      - CACHE_TTL_MINUTES=5
      - MAX_CACHE_ROWS=10000
      - QUERY_TIMEOUT_MS=30000
      - HOST=0.0.0.0
      - PORT=3001
      - CORS_ORIGIN=
    volumes:
      - sqlboard-data:/data
    depends_on:
      sqld:
        condition: service_healthy
      garage:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  sqld-data:
    driver: local
  garage-data:
    driver: local
  garage-meta:
    driver: local
  sqlboard-data:
    driver: local
