# Multi-service compose with PostgreSQL for production.
# Usage: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: sqlboard-postgres
    environment:
      - POSTGRES_DB=sqlboard
      - POSTGRES_USER=sqlboard
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sqlboard -d sqlboard"]
      interval: 10s
      timeout: 5s
      retries: 5

  sqlboard:
    build: .
    image: sqlboard:latest
    container_name: sqlboard
    ports:
      - "3001:3001"
    environment:
      - DATA_DIR=/data
      - DATABASE_URL=postgres://sqlboard:${POSTGRES_PASSWORD}@postgres:5432/sqlboard
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - TENANCY_ENABLED=${TENANCY_ENABLED:-false}
      - BASE_DOMAIN=${BASE_DOMAIN:-}
      - CACHE_TTL_MINUTES=${CACHE_TTL_MINUTES:-5}
      - MAX_CACHE_ROWS=${MAX_CACHE_ROWS:-10000}
      - QUERY_TIMEOUT_MS=${QUERY_TIMEOUT_MS:-30000}
      - HOST=0.0.0.0
      - PORT=3001
      - CORS_ORIGIN=${CORS_ORIGIN:-}
    volumes:
      - sqlboard-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  postgres-data:
    driver: local
  sqlboard-data:
    driver: local
