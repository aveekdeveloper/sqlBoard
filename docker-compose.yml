services:
  sqlboard:
    build: .
    image: sqlboard:latest
    container_name: sqlboard
    ports:
      - "3001:3001"
    environment:
      - DATA_DIR=/data
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - CACHE_TTL_MINUTES=${CACHE_TTL_MINUTES:-5}
      - MAX_CACHE_ROWS=${MAX_CACHE_ROWS:-10000}
      - QUERY_TIMEOUT_MS=${QUERY_TIMEOUT_MS:-30000}
      - HOST=0.0.0.0
      - PORT=3001
    volumes:
      - sqlboard-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  sqlboard-data:
    driver: local
