# Multi-tenant compose (simplified for Dokploy).
# Usage: docker compose -f docker-compose.yml up -d
services:
  sqld:
    image: ghcr.io/tursodatabase/libsql-server:latest
    environment:
      - SQLD_NODE=primary
      - SQLD_HTTP_LISTEN_ADDR=0.0.0.0:8080
    volumes:
      - sqld-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5

  sqlboard:
    build: .
    ports:
      - "3001:3001"
    environment:
      - DATA_DIR=/data
      - DATABASE_URL=http://sqld:8080
      - LIBSQL_AUTH_TOKEN=${LIBSQL_AUTH_TOKEN:-}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - TENANCY_ENABLED=${TENANCY_ENABLED:-true}
      - BASE_DOMAIN=${BASE_DOMAIN:-}
      - CACHE_TTL_MINUTES=${CACHE_TTL_MINUTES:-5}
      - MAX_CACHE_ROWS=${MAX_CACHE_ROWS:-10000}
      - QUERY_TIMEOUT_MS=${QUERY_TIMEOUT_MS:-30000}
      - HOST=0.0.0.0
      - PORT=3001
      - CORS_ORIGIN=${CORS_ORIGIN:-}
    volumes:
      - sqlboard-data:/data
    depends_on:
      - sqld
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  sqld-data:
    driver: local
  sqlboard-data:
    driver: local
